[supervisord]
nodaemon=true

[program:celery]
command=celery -A celery_config:celery_app worker -l info
directory=/app
user=root
autostart=true
autorestart=true
stdout_logfile=/app/data/logs/celery/out.log
stderr_logfile=/app/data/logs/celery/error.log
stdout_logfile_maxbytes=5MB
stdout_logfile_backups=10
stderr_logfile_maxbytes=5MB
stderr_logfile_backups=10

[program:app]
command=uvicorn app:app --host 0.0.0.0 --port 8001 --timeout-keep-alive 60
directory=/app
user=root
autostart=true
autorestart=true
stdout_logfile=/app/data/logs/console/out.log
stderr_logfile=/app/data/logs/console/error.log
stdout_logfile_maxbytes=5MB
stdout_logfile_backups=10
stderr_logfile_maxbytes=5MB
stderr_logfile_backups=10