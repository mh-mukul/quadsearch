services:
  # Redis service
  redis:
    image: redis:latest
    container_name: quadsearch-redis
    restart: always
    security_opt:
      - seccomp:unconfined
    cap_add:
      - SYS_NICE
    command: ["redis-server", "--protected-mode", "no"]
    networks:
      - quadsearch_network

  # Qdrant service 
  qdrant:
    image: qdrant/qdrant:latest
    restart: always
    container_name: qdrant
    ports:
      - 6333:6333
      - 6334:6334
    expose:
      - 6333
      - 6334
    configs:
      - source: qdrant_config
        target: /qdrant/config/production.yaml
    volumes:
      - ./qdrant_data:/qdrant/storage
    environment:
      - QDRANT__SERVICE__API_KEY=${QDRANT_API_KEY}
    networks:
      - quadsearch_network

  # Backend service
  quadsearch-backend:
    build: .
    container_name: quadsearch-backend
    image: quadsearch-backend
    restart: always
    ports:
      - "${DOCKER_PORT:-8001}:8001"
    environment:
      - TZ=Asia/Dhaka
    volumes:
      - ${LOG_DIR:-./logs}:/app/${LOG_DIR}
      - ./:/app
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8001/health || exit 1"]
      interval: 1m
      timeout: 5s
      retries: 3
      start_period: 30s
    networks:
      - quadsearch_network
    depends_on:
      - redis
      - qdrant

configs:
  qdrant_config:
    content: |
      log_level: INFO

networks:
  quadsearch_network:
    driver: bridge